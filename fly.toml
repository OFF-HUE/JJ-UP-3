# Fly.io example. Run: fly launch --no-deploy, fly volumes create jjup_data --size 1, set secrets, fly deploy
app = "jjup"
primary_region = "fra"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DB_PATH = "/data/jjup.db"
  TRUST_PROXY = "1"
  APP_URL = "https://jjup.fly.dev"

[mounts]
  source = "jjup_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
